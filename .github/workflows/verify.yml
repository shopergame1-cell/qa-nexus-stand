name: verify stand

# TASK-55.1: перевірка стенда без корпоративних систем — усе локально.
# Кроки: підняти Nexus -> створити репозиторії -> задеплоїти свій артефакт ->
# переконатись, що збірка тягне його САМЕ зі стенда (у чистому локальному кеші).

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  stand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Підняти Nexus
        run: docker compose up -d

      - name: Дочекатись готовності і створити репозиторії
        run: bash setup-repos.sh 2>&1 | tee /tmp/setup.log

      - name: Пояснити, на чому впало налаштування стенда
        if: failure()
        run: |
          echo "=== останні 30 рядків налаштування ==="
          tail -30 /tmp/setup.log || true
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Стенд (налаштування)::$line"
          done < <(grep -a -m6 -E '✗|помилка|НЕМАЄ' /tmp/setup.log || true)

      - name: Діагностика авторизації — що Maven реально бачить
        run: |
          echo "=== server id у settings.xml ==="
          python3 - <<'PY'
          import re, pathlib
          t = pathlib.Path('settings.xml').read_text(encoding='utf-8')
          print('   server id:', re.findall(r'<server>\s*<id>([^<]+)</id>', t))
          print('   довжина пароля:', [len(p) for p in re.findall(r'<password>([^<]*)</password>', t)])
          pathlib.Path('/tmp/pw.txt').write_text(re.findall(r'<password>([^<]*)</password>', t)[0], encoding='utf-8')
          PY
          echo "=== що Maven бачить у своїх ефективних налаштуваннях ==="
          mvn -q -B -s settings.xml help:effective-settings -Doutput=/tmp/eff.xml >/dev/null 2>&1 || true
          grep -o '<id>qa-releases</id>' /tmp/eff.xml 2>/dev/null | head -2 || echo "   (ефективні налаштування не згенерувались)"
          echo "=== точні коди curl для того самого шляху, куди пише Maven ==="
          auth=$(curl -s -o /dev/null -w '%{http_code}' -u "admin:$(cat /tmp/pw.txt)" "http://localhost:8081/service/rest/v1/security/users")
          echo "   авторизація в REST: HTTP $auth"
          code=$(curl -s -o /tmp/put-real.out -w '%{http_code}' -u "admin:$(cat /tmp/pw.txt)" --upload-file lib/pom.xml \
            "http://localhost:8081/repository/qa-releases/qa/mentorship/qa-demo-lib/1.0.0/qa-demo-lib-1.0.0.pom")
          echo "   PUT артефакту: HTTP $code"
          echo "::error title=Діагностика кред::REST auth HTTP $auth, PUT артефакту HTTP $code (тим самим паролем, що й Maven)"
          echo "::notice title=Діагностика PUT::HTTP $code (тим самим шляхом, куди пише Maven)"
          echo "::notice title=Діагностика settings::$(head -c 120 /tmp/pw.txt | wc -c) символів у паролі, id qa-releases: $(grep -c '<id>qa-releases</id>' /tmp/eff.xml 2>/dev/null || echo 0)"
          echo "::notice title=Діагностика коду сторінки::$(head -c 150 /tmp/put-real.out 2>/dev/null | tr -d '\n')"
          head -c 200 /tmp/put-real.out || true

      - name: Підставити в settings.xml робочий пароль адміністратора
        run: |
          # Nexus генерує пароль адміністратора сам; у різних версіях він або у файлі
          # /nexus-data/admin.password, або відразу з env. Тому не вгадуємо, а перевіряємо,
          # який із двох справді авторизується ПРЯМО ЗАРАЗ, і підставляємо саме його.
          FROM_FILE=$(docker compose exec -T nexus cat /nexus-data/admin.password 2>/dev/null | tr -d '\r\n' || true)
          CANDIDATES="$FROM_FILE qa-stand-admin"
          WORKING=""
          for pw in $CANDIDATES; do
            [ -z "$pw" ] && continue
            if curl -sf -u "admin:$pw" "http://localhost:8081/service/rest/v1/repositories" >/dev/null 2>&1; then
              WORKING="$pw"
              break
            fi
          done
          if [ -z "$WORKING" ]; then
            echo "::error title=Rобочий пароль::жоден із кандидатів не авторизується (файл: ${#FROM_FILE} символів)"
            exit 1
          fi
          echo "::error title=Робочий пароль::знайдено пароль, що авторизується (з файлу: $([ -n "$FROM_FILE" ] && echo так || echo ні))"
          python3 - "$WORKING" <<'PY'
          import pathlib, sys
          pw = sys.argv[1]
          p = pathlib.Path("settings.xml")
          t = p.read_text(encoding="utf-8")
          import re
          t = re.sub(r"<password>[^<]*</password>", f"<password>{pw}</password>", t)
          p.write_text(t, encoding="utf-8")
          print("   settings.xml оновлено робочим паролем")
          PY

      - name: Задеплоїти власний артефакт у внутрішній репозиторій
        run: |
          mkdir -p /tmp/local-repo
          set -o pipefail
          if mvn -B -X -s settings.xml -Dmaven.repo.local=/tmp/local-repo -f lib/pom.xml deploy 2>&1 | tee /tmp/deploy.log | tail -20; then
            echo "деплой пройшов рідним транспортом"
          else
            echo "--- рідний транспорт не спрацював, пробую wagon ---"
            mvn -B -X -s settings.xml -Dmaven.resolver.transport=wagon -Dmaven.repo.local=/tmp/local-repo \
              -f lib/pom.xml deploy 2>&1 | tee /tmp/deploy-wagon.log | tail -20
          fi

      - name: Перевірити, що артефакт лежить саме у стенді
        run: |
          curl -sf -u admin:qa-stand-admin \
            http://localhost:8081/repository/qa-releases/qa/mentorship/qa-demo-lib/1.0.0/qa-demo-lib-1.0.0.pom \
            -o /dev/null && echo "POM знайдено у qa-releases"

      - name: Зібрати споживача в ЧИСТОМУ локальному кеші (має тягнути зі стенда)
        run: |
          rm -rf /tmp/consumer-repo
          mkdir -p /tmp/consumer-repo
          mvn -B -s settings.xml -Dmaven.repo.local=/tmp/consumer-repo -f consumer/pom.xml -X dependency:resolve \
            | tee /tmp/consumer.log
          grep -q "qa-public" /tmp/consumer.log && echo "залежність знайдено через внутрішній репозиторій"

      - name: Негативна перевірка — без внутрішнього репозиторію збірка мусить упасти
        run: |
          rm -rf /tmp/negative-repo
          mkdir -p /tmp/negative-repo
          if mvn -q -B -Dmaven.repo.local=/tmp/negative-repo -f consumer/pom.xml dependency:resolve; then
            echo "ПОМИЛКА: збірка пройшла без внутрішнього репозиторію — артефакт є в Central? Такого бути не може."
            exit 1
          else
            echo "Очікувано: без внутрішнього репозиторію залежність не розвʼязується"
          fi

      - name: Показати рядки Maven про авторизацію
        if: failure()
        run: |
          tr -d '\r' < /tmp/deploy.log > /tmp/deploy.clean.log || true
          echo "=== рядки про авторизацію ==="
          grep -a -m10 -iE 'authoriz|authenticat|credentials|basic |challenge|WWW-Auth' /tmp/deploy.clean.log || echo "(рядків про авторизацію немає)"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Maven auth::$line"
          done < <(grep -a -m6 -iE 'authoriz|authenticat|credentials|basic |WWW-Auth' /tmp/deploy.clean.log || true)
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Maven repository::$line"
          done < <(grep -a -m4 -E 'Using (mirror|server)|repository.*qa-releases|qa-releases.*repository' /tmp/deploy.clean.log || true)

      - name: Пояснити причину падіння (анотація у UI)
        if: failure()
        run: |
          echo "=== ключові рядки Maven ==="
          grep -nE 'Blocked mirror|401|403|Return code is|Could not (transfer|resolve|find)|Non-resolvable|Transfer failed' /tmp/deploy.log | head -10 || echo "(нічого з відомих сигнатур)"
          echo "=== останні 25 рядків ==="
          tail -25 /tmp/deploy.log || true
          # Maven друкує прогрес із \r — прибираємо їх, інакше grep за анкором не бачить рядків
          tr -d '\r' < /tmp/deploy.log > /tmp/deploy.clean.log || true
          [ -f /tmp/deploy-wagon.log ] && { tr -d '\r' < /tmp/deploy-wagon.log > /tmp/deploy-wagon.clean.log; echo "(була спроба через wagon)"; }

          echo "=== ключові рядки ==="
          grep -a -m8 -E 'Failed to execute goal|Could not|Return code is|Non-resolvable|401|403|Blocked mirror' /tmp/deploy.clean.log || echo "(ключових рядків не знайдено)"

          # анотації: саме причина падіння, а не хвіст із посиланнями на довідку
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Maven (причина)::$line"
          done < <(grep -a -m5 -E 'Failed to execute goal|Return code is|Could not transfer|Could not deploy|Non-resolvable' /tmp/deploy.clean.log || true)

          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=Maven (помилка)::$line"
          done < <(grep -a -E '^\[ERROR\]' /tmp/deploy.clean.log | head -5 || true)

          echo "=== контекст навколо першої помилки ==="
          grep -a -n -m1 -A6 -B2 'Failed to execute goal' /tmp/deploy.clean.log || tail -40 /tmp/deploy.clean.log || true

      - name: Логи Nexus, якщо щось впало
        if: failure()
        run: |
          docker compose logs --tail=200
          echo "--- локальний кеш ---"
          ls -R /tmp/local-repo 2>/dev/null | head -40 || true
          echo "--- перевірка доступності репозиторію ззовні ---"
          curl -s -u admin:qa-stand-admin -o /dev/null -w 'qa-releases: %{http_code}\n' \
            http://localhost:8081/repository/qa-releases/ || true

      - name: Вивантажити логи прогону (щоб було видно причину без доступу до UI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-logs
          path: |
            /tmp/consumer.log
            /tmp/local-repo/**/*.pom
          if-no-files-found: ignore

      - name: Прибрати стенд
        if: always()
        run: docker compose down -v
